name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            curl \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libvulkan-dev \
            pkg-config \
            build-essential

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build release binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release -p strata-app

      - name: Package Linux artifact
        run: |
          mkdir -p dist
          cp target/release/strata-app dist/strata-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: strata-linux
          path: dist/strata-linux

  build-windows:
    name: Cross-compile Windows (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW and WiX tools
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            curl \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            wixl \
            pkg-config \
            build-essential

      - name: Install Rust toolchain with Windows target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cross-compile Windows release binary
        env:
          CFLAGS_x86_64_pc_windows_gnu: "-Wa,-mbig-obj"
          CXXFLAGS_x86_64_pc_windows_gnu: "-Wa,-mbig-obj"
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release -p strata-app --target x86_64-pc-windows-gnu

      - name: Build Windows installer (.msi)
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/strata-app.exe dist/strata.exe
          wixl -o dist/strata.msi packaging/windows/strata.wxs

      - name: Upload Windows artifacts (.exe & .msi)
        uses: actions/upload-artifact@v4
        with:
          name: strata-windows
          path: dist/
