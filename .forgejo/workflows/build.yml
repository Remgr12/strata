name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-linux:
    name: Build Linux & Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies & Flatpak tools
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            curl \
            python3 \
            zstd \
            flatpak \
            flatpak-builder \
            ostree \
            librsvg2-common \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libvulkan-dev \
            pkg-config \
            build-essential

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo dependencies and target
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-

      - name: Build release binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release -p strata-app

      - name: Package Linux binary & Flatpak bundle
        run: |
          mkdir -p dist
          cp target/release/strata-app dist/strata-linux
          chmod +x scripts/build-flatpak.sh
          bash scripts/build-flatpak.sh dist/strata-linux dist/strata-linux-x86_64.flatpak x86_64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v3
        with:
          name: strata-linux
          path: dist/

      - name: Prune unneeded build cache files
        if: always()
        run: |
          rm -rf \
            target/duckdb-sources \
            target/*/duckdb-sources \
            target/release/incremental \
            target/*/release/incremental \
            target/release/strata-app* \
            target/*/release/strata-app* \
            .flatpak-builder build-dir repo
          python3 - <<'PY'
          import glob, os, re, shutil

          for pattern in [
              "target/release/deps",
              "target/*/release/deps",
              "target/release/build",
              "target/*/release/build",
              "target/release/.fingerprint",
              "target/*/release/.fingerprint",
          ]:
              for d in glob.glob(pattern):
                  if not os.path.isdir(d):
                      continue
                  groups = {}
                  for entry in os.listdir(d):
                      m = re.match(r"^(.+)-([0-9a-f]{16})(\..+)?$", entry)
                      if not m:
                          continue
                      prefix, h = m.group(1), m.group(2)
                      path = os.path.join(d, entry)
                      try:
                          mtime = os.path.getmtime(path)
                      except OSError:
                          continue
                      groups.setdefault(prefix, {}).setdefault(h, []).append((mtime, path))
                  for prefix, hashes in groups.items():
                      if len(hashes) <= 1:
                          continue
                      ranked = sorted(
                          hashes.items(),
                          key=lambda kv: max(mt for mt, _ in kv[1]),
                          reverse=True,
                      )
                      for _, items in ranked[1:]:
                          for _, path in items:
                              if os.path.isdir(path):
                                  shutil.rmtree(path, ignore_errors=True)
                              elif os.path.exists(path):
                                  os.remove(path)

          cache_blobs = sorted(
              [p for p in glob.glob("/runner-cache/actcache/cache/*/*") if os.path.isfile(p)],
              key=os.path.getmtime,
              reverse=True,
          )
          for stale in cache_blobs[2:]:
              try:
                  os.remove(stale)
              except OSError:
                  pass
          PY

  build-windows:
    name: Cross-compile Windows (x86_64)
    runs-on: ubuntu-latest
    container:
      image: node:22-trixie
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW and WiX tools
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; else SUDO=""; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            curl \
            python3 \
            zstd \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            wixl \
            pkg-config \
            build-essential
          $SUDO update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          $SUDO update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Install Rust toolchain with Windows target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo dependencies and target
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-

      - name: Patch GPUI for Windows cross-compilation
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fetch --target x86_64-pc-windows-gnu
          bash scripts/patch-gpui.sh

      - name: Cross-compile Windows release binary (with static MinGW runtime bundling)
        env:
          CC_x86_64_pc_windows_gnu: "x86_64-w64-mingw32-gcc-posix"
          CXX_x86_64_pc_windows_gnu: "x86_64-w64-mingw32-g++-posix"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: "x86_64-w64-mingw32-g++-posix"
          CFLAGS_x86_64_pc_windows_gnu: "-Wa,-mbig-obj"
          CXXFLAGS_x86_64_pc_windows_gnu: "-Wa,-mbig-obj"
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release -p strata-app --target x86_64-pc-windows-gnu

      - name: Build Windows installer (.msi) and standalone executable (.exe)
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/strata-app.exe dist/strata.exe
          cp $(find /usr/lib/gcc/x86_64-w64-mingw32 -name "libstdc++-6.dll" | grep posix | head -n 1) dist/
          cp $(find /usr/lib/gcc/x86_64-w64-mingw32 -name "libgcc_s_seh-1.dll" | grep posix | head -n 1) dist/
          cp $(find /usr/x86_64-w64-mingw32 -name "libwinpthread-1.dll" | head -n 1) dist/
          x86_64-w64-mingw32-strip --strip-unneeded dist/strata.exe
          # Strip .rsrc from bundled MinGW DLLs so Windows Installer MsiFileHash versioning never skips libwinpthread-1.dll
          x86_64-w64-mingw32-strip --strip-unneeded -R .rsrc dist/libstdc++-6.dll dist/libgcc_s_seh-1.dll dist/libwinpthread-1.dll
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$VERSION" ] && [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            sed -i "s/^[[:space:]]*Version=\"[^\"]*\"/           Version=\"$VERSION\"/" packaging/windows/strata.wxs
          fi
          wixl -a x64 --ext ui -I packaging/windows -o dist/strata.msi packaging/windows/strata.wxs

      - name: Upload Windows artifacts (.exe & .msi)
        uses: actions/upload-artifact@v3
        with:
          name: strata-windows
          path: dist/

      - name: Prune unneeded build cache files
        if: always()
        run: |
          rm -rf \
            target/duckdb-sources \
            target/*/duckdb-sources \
            target/release/incremental \
            target/*/release/incremental \
            target/release/strata-app* \
            target/*/release/strata-app*
          python3 - <<'PY'
          import glob, os, re, shutil

          for pattern in [
              "target/release/deps",
              "target/*/release/deps",
              "target/release/build",
              "target/*/release/build",
              "target/release/.fingerprint",
              "target/*/release/.fingerprint",
          ]:
              for d in glob.glob(pattern):
                  if not os.path.isdir(d):
                      continue
                  groups = {}
                  for entry in os.listdir(d):
                      m = re.match(r"^(.+)-([0-9a-f]{16})(\..+)?$", entry)
                      if not m:
                          continue
                      prefix, h = m.group(1), m.group(2)
                      path = os.path.join(d, entry)
                      try:
                          mtime = os.path.getmtime(path)
                      except OSError:
                          continue
                      groups.setdefault(prefix, {}).setdefault(h, []).append((mtime, path))
                  for prefix, hashes in groups.items():
                      if len(hashes) <= 1:
                          continue
                      ranked = sorted(
                          hashes.items(),
                          key=lambda kv: max(mt for mt, _ in kv[1]),
                          reverse=True,
                      )
                      for _, items in ranked[1:]:
                          for _, path in items:
                              if os.path.isdir(path):
                                  shutil.rmtree(path, ignore_errors=True)
                              elif os.path.exists(path):
                                  os.remove(path)

          cache_blobs = sorted(
              [p for p in glob.glob("/runner-cache/actcache/cache/*/*") if os.path.isfile(p)],
              key=os.path.getmtime,
              reverse=True,
          )
          for stale in cache_blobs[2:]:
              try:
                  os.remove(stale)
              except OSError:
                  pass
          PY

  release:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v3
        with:
          name: strata-linux
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v3
        with:
          name: strata-windows
          path: artifacts/windows

      - name: Publish Forgejo Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python3 scripts/publish-release.py
